<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="script.js">
    <title>Új eszkozok letrehozasa</title>
</head>
<body>
    <div class="container">
        <h1>Új eszkozok letrehozasa</h1>
        <form id="eszkozForm">
            <div class="row g-3">


                <div class="col-md-6">
                    <label class="form-label">Név</label>
                    <input id="nev" class="form control" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Leltári szám</label>
                    <input id="leltariSzam" class="form control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Kategoria</label>
                    <input id="kategoria" class="form control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gyártó</label>
                    <input id="gyarto" class="form control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Modell</label>
                    <input id="modell" class="form control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Terem</label>
                    <input id="terem" class="form control" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Állapot</label>
                    <input id="allapot" class="form control" required>
                </div>


                <div class="col-md-4">
                    <label class="form-label">Beszerzési ár</label>
                    <input id="beszerzesiAr" class="form control" type="number" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Beszerzés datuma</label>
                    <input id="beszerzesdatuma" class="form control" type="date" required>
                </div>

                <div class="col-md-4">

                    <div class="form-check mt-4">
                        <input id="hasznalatbanVan" class="form-check-input" type="checkbox" required>
                        <label class="form-check-input">Hasznalatban van</label>
                        
                        
                    </div>
                    <div class="form-check mt-4">
                        <input id="kolcsonozheto" class="form-check-input" type="checkbox" required>
                        <label class="form-check-label">Kolcsonozheto</label>
                        
                        
                    </div>

                    

                    
                </div>

            </div>

            <button class="btn btn-warning mt-4" type="submit">Létrehozas</button>
        </form>

        <div id="uzenet" class="mt-3">...</div>

    </div>

</body>
</html>
